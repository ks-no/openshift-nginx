on:
  push:
    branches: [main]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      is_release:
        description: 'Skal prosjektet releases?'
        type: boolean
        default: false
      # Velg enten semver_increment ELLER version – ikke begge.
      # Om begge settes vil den reusable workflowen feile.
      semver_increment:
        description: 'Select semver increment version. Fails if version input if selected.'
        required: false
        type: choice
        options:
          - ''
          - next major
          - next minor
          - next patch
      version:
        description: 'Exact version number to release. Fails if semver_increment input is selected.'
        required: false

env:
  IMAGE: fiks-nginx-openshift

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Git credentials
        uses: ks-no/github-actions-public/setup-github-app@main
        id: setup-github-app
        with:
          ks_github_app_id: ${{ secrets.KS_RUNNER_APP_ID }}
          ks_github_app_private_key: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}

      - name: Checkout
        uses: ks-no/github-actions-public/checkout@main
        with:
          token: '${{ steps.setup-github-app.outputs.app_token }}'

      - name: Resolve version
        id: version
        uses: ks-no/github-actions-public/complete-version-resolvement@main
        with:
          semver_increment: ${{ inputs.semver_increment }}
          version: ${{ inputs.version }}
          is_release: ${{ inputs.is_release || 'false' }}

      - name: Setup JFrog CLI
        uses: ks-no/github-actions-public/setup-jfrog-cli@main
        with:
          artifactory_username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory_password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Log in to Artifactory (for base image pull)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 #v4.4.0
        with:
          registry: docker-all.artifactory.fiks.ks.no
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Build Docker image
        id: build_image
        shell: bash
        run: |
          docker build \
            -t "$IMAGE" \
            -f "nginx/Dockerfile" \
            --no-cache \
            .

      - name: Tag and Push Docker image
        id: tag
        shell: bash
        run: |
          PUSH_TAG="$REPO_URL/$IMAGE:$TAG"
          echo "Tagging and pushing $IMAGE as $PUSH_TAG"
          docker tag "$IMAGE" "$PUSH_TAG"
          jfrog docker push "$PUSH_TAG"
          echo "tagged_image=$PUSH_TAG" >> $GITHUB_OUTPUT
        env:
          REPO_URL: ${{ inputs.is_release == true && 'docker-local.artifactory.fiks.ks.no' || 'docker-local-snapshots.artifactory.fiks.ks.no' }}
          TAG: ${{ steps.version.outputs.resolved_version }}

      - name: Generate SBOM
        id: sbom
        if: github.ref_name == 'main'
        uses: ks-no/github-actions-public/syft-sbom@main
        with:
          image_name: ${{ steps.tag.outputs.tagged_image }}

      - name: '"Manually" touch up the SBOM'
        if: github.ref_name == 'main'
        run: |
          # There is apparently a mismatch between the CPE identifier of nginx that the NVD registry uses,
          # and the one generated by Syft. We go directly into the BOM file and change nginx's CPE so that
          # Dependency-Track can analyze it properly.
          # Original solution courtesy of Kristian Berg.
          jq -c 'if (.components | map(select(.name == "nginx")) | length) > 1 then 
                error("The script cannot handle this input; several components named \"nginx\"") end
                | (.components[] | select(.name == "nginx")) 
                |= (.cpe |= sub("nginx:nginx:(?<v>[0-9]+\\.[0-9]+\\.[0-9])-r[0-9]+"; "f5:nginx:\(.v)"))' \
            > "${BOM_FILE}.tmp"
          mv "${BOM_FILE}.tmp" "$BOM_FILE"
        env:
          BOM_FILE: ${{ steps.sbom.outputs.bom_file }}

      - name: Upload SBOM to Dependency-Track
        if: github.ref_name == 'main'
        uses: ks-no/github-actions-public/sbom-upload-and-report@main
        with:
          dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project_name: ${{ inputs.image_name }}
          is_release: ${{ inputs.is_release }}
          bom_file: ${{ steps.sbom.outputs.bom_file }}

      - name: Publish build info
        shell: bash
        run: |
          jfrog rt build-publish "$JFROG_CLI_BUILD_NAME" "$GITHUB_RUN_NUMBER"

      - name: Create release tag
        if: inputs.is_release == true
        run: |
          git tag -a "$TAG" \
            -m "Releasing build ${{ github.run_number }}"
          git push origin "$TAG"
        env:
          TAG: ${{ steps.version.outputs.resolved_version }}

      - name: Publish to GitHub Packages
        if: inputs.is_release == true
        run: |
          TARGET_IMAGE="${GH_REGISTRY}/ks-no/openshift-nginx/${IMAGE}:${VERSION}"
          docker
          docker tag ${IMAGE} "$TARGET_IMAGE"
          docker login -u "${{ github.actor }}" -p "$PASSWORD" "$GH_REGISTRY"
          docker push "$TARGET_IMAGE"
          docker logout "$GH_REGISTRY"
        env:
          PASSWORD: ${{ secrets.OPENSHIFT_NGINX_PUBLISH_PAGE }} # expires May 7, 2027
          VERSION: ${{ steps.version.outputs.resolved_version }}
          GH_REGISTRY: ghcr.io